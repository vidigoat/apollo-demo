# Apollo on every pull request that changes package-lock.json.
#
# It reads the lockfile at the pull request's head and at its base, and for every version the pull
# request bumps it asks Apollo's published record whether that exact release pair was watched, old
# against new, and what changed. It installs nothing and runs nobody's code.
#
# A release the rules call notable or alarming fails the check. A bump nobody has compared is named
# and passes — unknown is never a failure.

name: Apollo

on:
  pull_request:
    paths: ['**/package-lock.json']

permissions:
  contents: read

jobs:
  behaviour:
    name: What these upgrades change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Compare every bumped release against the published record
        run: |
          set +e
          node .github/apollo/cli.cjs upgrade \
            --against "origin/${{ github.base_ref }}" \
            --index https://apollo-watch.vercel.app/index.json > apollo.txt 2>&1
          status=$?
          cat apollo.txt
          # The verdict where anyone can read it, signed in or not: the run's summary page, and one
          # annotation per release the rules flag.
          { echo '### Apollo: what these upgrades change'; echo; echo '```'; cat apollo.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^ +(alarming|notable) ' apollo.txt | while read -r sev pkg from arrow to why; do
            echo "::error title=Apollo: ${pkg} ${from} → ${to} is ${sev}::${why}"
          done
          exit $status
